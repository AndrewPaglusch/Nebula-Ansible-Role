---
- name: Validate every guest before accessing it
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    test_require_instances: true
  tasks:
    - name: Inspect resource ownership
      ansible.builtin.include_tasks: resources.yml
