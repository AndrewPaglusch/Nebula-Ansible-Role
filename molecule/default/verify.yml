---
- name: Verify node-to-node overlay connectivity
  hosts: node1
  gather_facts: false
  tasks:
    - name: Check connectivity through the configured tunnel
      block:
        - name: Read the configuration installed by the role
          ansible.builtin.slurp:
            src: "{{ nebula_config_dir }}/config.yml"
          register: installed_config

        - name: Ping node2's Nebula address through node1's Nebula interface
          ansible.builtin.command:
            argv:
              - ping
              - -I
              - "{{ (installed_config.content | b64decode | from_yaml).tun.dev }}"
              - -n
              - -c
              - '1'
              - -W
              - '2'
              - "{{ hostvars['node2'].nebula_internal_ip_addr }}"
          register: overlay_ping
          until: overlay_ping.rc == 0
          retries: 12
          delay: 2
          changed_when: false
      rescue:
        - name: Preserve the original verification failure for diagnostics
          ansible.builtin.set_fact:
            overlay_failed: true
            # Keep useful error fields, not slurped configuration or other content.
            overlay_failure:
              task: "{{ ansible_failed_task.name }}"
              message: "{{ ansible_failed_result.msg | default('Task failed without a message') }}"
              rc: "{{ ansible_failed_result.rc | default('unavailable') }}"
              stdout: "{{ ansible_failed_result.stdout | default('') }}"
              stderr: "{{ ansible_failed_result.stderr | default('') }}"

- ansible.builtin.import_playbook: diagnostics.yml
  when: hostvars['node1'].overlay_failed | default(false)

- name: Preserve the verifier's failed exit status after diagnostics
  hosts: node1
  gather_facts: false
  tasks:
    - name: Require successful Nebula verification
      ansible.builtin.assert:
        that: not (overlay_failed | default(false))
        fail_msg: |-
          Nebula verification failed. Original failing operation:
          {{ overlay_failure | default({}) | to_nice_yaml }}
          See diagnostics above.
