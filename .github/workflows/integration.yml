name: Nebula integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [default, nebula-1-12]
    env:
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Alpha action: pin reviewed code, including bridge-scoped Docker firewall rules.
      - uses: canonical/setup-lxd@25c036d6aa7fd68c4d980887ad2c0fb122234cd0
        with:
          channel: 5.21/stable
      - name: Install test dependencies
        run: python -m pip install -r molecule/requirements.txt
      - name: Run the same smoke test as local development
        run: molecule test -s "$SCENARIO" --destroy=never
      - name: Collect diagnostics before removing failed instances
        if: failure()
        run: molecule side-effect -s "$SCENARIO"
      - name: Remove test instances
        if: always()
        run: molecule destroy -s "$SCENARIO"
