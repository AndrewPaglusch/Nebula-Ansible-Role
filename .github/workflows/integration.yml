name: Nebula integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [default, nebula-1-12]
    env:
      SCENARIO: ${{ matrix.scenario }}
    steps:
      # Pin action revisions for consistent runs. Validate newer versions in CI
      # and update the pins once both smoke scenarios still pass.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (released 2026-07-20)
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (released 2026-10-22)
        with:
          python-version: '3.12'
      # Alpha action: pin reviewed code, including bridge-scoped Docker firewall rules.
      - uses: canonical/setup-lxd@25c036d6aa7fd68c4d980887ad2c0fb122234cd0 # Untagged (commit 2026-11-10)
        with:
          channel: 5.21/stable
      - name: Install test dependencies
        run: python -m pip install -r molecule/requirements.txt
      # Retain guests so failures in any phase can be diagnosed before cleanup.
      - name: Run the same smoke test as local development
        run: molecule test -s "$SCENARIO" --destroy=never
      - name: Collect diagnostics before removing failed instances
        if: failure()
        run: molecule side-effect -s "$SCENARIO"
      - name: Remove test instances
        if: always()
        run: molecule destroy -s "$SCENARIO"
